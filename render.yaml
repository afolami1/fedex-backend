services:

      type: web
      name: fedex-backend
      runtime: python
      buildCommand: bash build.sh
      startCommand: gunicorn config.wsgi:application

      envVars:

       key: PYTHON_VERSION
       value: 3.14.7
       key: DJANGO_SECRET_KEY
       generateValue: true
       key: DATABASE_URL
       fromDatabase:
       name: fedex-db
       property: connectionString

databases:

      name: fedex-db
      databaseName: fedex
      user: fedex